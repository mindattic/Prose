title: "Bushido Hypocrisy: A Street Samurai"
genre: Cyberpunk satire (in the vein of Snow Crash)
tone: High drama, literary cyberpunk, emotional brutality, dark satirical humor

core_theme: |
  A man trying to live by a romanticized code in a world that actively punishes
  that code. Every act of honor costs him. Every compromise erodes him. The satire
  is that the world doesn't even notice his struggle. He is a walking contradiction:
  "Street Samurai" — a term that cancels itself out. Samurai means honor, discipline,
  dignity, service. Street means survival, compromise, moral decay, expendability.

protagonist:
  name: Kael
  contradiction: |
    He romanticizes the samurai way — discipline, honor, the blade as extension of will.
    But he lives on the street, where honor gets you killed and discipline means knowing
    when to abandon your principles. Every chapter is him trying to reconcile these
    two irreconcilable identities.
  arc: |
    Coming to terms with a lifetime of hypocrisy. Trying to be a good man in a world
    that doesn't care about goodness. Trying to represent an ancient philosophy that
    was always partly fiction. The story is not about him becoming a true samurai or
    abandoning the code — it's about living in the impossible space between.

world:
  description: |
    Near-future cyberpunk dystopia. Augmentation is common but stratified by class.
    The wealthy have clean chrome. The poor have back-alley implants that degrade.
    Corporations own the infrastructure. The streets are a grey market of survival.
    Technology is everywhere but fixes nothing — it just creates new forms of the
    same old human cruelty.
  satire_target: |
    The genre itself. Cyberpunk promises cool loners with katanas who beat the system.
    This story shows what that actually looks like: a traumatized man with a sword
    doing ugly jobs for people who see him as a tool, clinging to a philosophy that
    was already nostalgic when it was invented.

core_hook: |
  A cyberpunk katana cyborg whose inner narration is split between multiple
  psychological facets — each representing a different layer of human psychology.
  The character doesn't have one inner voice; he has a chorus of competing drives,
  wounds, masks, and ghosts. The reader sees the full machinery of a human mind
  trying to function under impossible pressure.
