type: world
name: "Meridian"
tagline: "Where Tomorrow Lives"
aliases: ["The City", "The Meri", "That Sinking Ship"]

description: |
  Meridian rises from the bones of what used to be a coastal metropolis — nobody
  remembers which one, or at least nobody with enough money to matter does. After
  the climate collapse turned the Pacific seaboard into a saltwater buffet, the
  megacorps swooped in with a plan: rebuild, rebrand, and charge rent. The result
  is Meridian, a city that looks like a tech demo from the top and a slow-motion
  disaster from the bottom. The corporate tagline — "Where Tomorrow Lives" — is
  still plastered on transit screens and building facades, a relic of the original
  marketing push that convinced eight million people to move into a vertical
  experiment in privatized governance. Tomorrow does live here, technically. It
  just can't afford the upper floors.

  The city is built in tiers, both literally and economically. The higher you go,
  the cleaner the air, the better the augments, the more convincing the illusion
  that everything is fine. At street level and below, Meridian is a tangle of
  repurposed infrastructure, black-market commerce, and people too stubborn or too
  trapped to leave. The sea still wants the city back — you can smell the brine on
  bad days, and the flood barriers groan like they're considering retirement. But
  the corps keep building upward, because upward is the only direction that looks
  good on a quarterly earnings report.

  Meridian is governed, in theory, by a city council. In practice, the council is
  a rubber stamp for Axiom Industries and its corporate peers. Laws are written in
  boardrooms. Police are privatized under the Axiom Security Solutions brand (motto:
  "Your Safety, Optimized"). Public services exist in the same way a vestigial organ
  exists — technically present, functionally irrelevant. The real governing happens
  through corporate access levels, which determine where you can go, what you can
  buy, and how much breathable air you're entitled to. Democracy didn't die in
  Meridian. It got acquired.

history:
  founding: |
    Built approximately 40 years ago on the ruins of a drowned coastal city after
    the Second Climate Collapse. A consortium of megacorps — led by Axiom Industries —
    pitched it as a "model city for the new era." The original residents of the
    drowned city were given the choice of relocation assistance (a bus ticket) or
    settlement in the new development (the lowest tiers, naturally). Most of the
    current population descends from climate refugees who arrived in the first two
    decades looking for work and found indentured employment contracts instead.
  key_events:
    - "Year 0: Meridian Charter signed by the Corporate Founding Council"
    - "Year 3: First habitable tiers completed. Marketing campaign launches."
    - "Year 8: The Great Flood Breach — sea wall failure drowns what is now Old Harbor"
    - "Year 12: Axiom Industries absorbs two rival corps, becomes dominant entity"
    - "Year 15: The Shelf begins growing as unofficial housing overflow"
    - "Year 18: Corporate Wars — three years of proxy conflicts between megacorps"
    - "Year 21: Armistice. Axiom emerges as de facto ruler. Police privatized."
    - "Year 25: AI Personhood Riots in the Circuit. No legal changes result."
    - "Year 30: Iron Lotus consolidates control of the Shelf"
    - "Year 38: Present day. The tagline hasn't changed. Everything else has."

geography:
  location: "Pacific coast, built on the ruins and stilts above a drowned predecessor city"
  elevation_range: "From 20 meters below sea level (Old Harbor) to 800+ meters (the Spire)"
  climate: |
    Artificial. Meridian runs a proprietary climate control system called
    AtmoSync(TM), managed by Axiom Environmental Services. It is supposed to
    maintain a comfortable 22C with mild breezes and scheduled rainfall for the
    rooftop gardens of the upper tiers. In practice, AtmoSync is buggy, underfunded,
    and running on code that hasn't been properly audited since Year 20. The result:
    the weather is always slightly wrong. Too humid. Too cold. Rain on clear days.
    Fog that rolls in from nowhere and smells like ozone and regret. The upper tiers
    get the closest approximation to "nice weather." The Shelf gets whatever leaks
    down. Old Harbor gets forgotten entirely — its weather is natural, which in the
    post-collapse world means unpredictable and occasionally violent.
  water: |
    The sea is omnipresent. Meridian is built on, over, and sometimes in it. The
    flood barriers are the city's most critical infrastructure and its most neglected.
    Drinking water is desalinated and corporate-controlled. There are three tiers of
    water quality: Premium (upper districts), Standard (mid-tiers), and Municipal
    (the Shelf and below — technically potable, tastes like a swimming pool).

population:
  total: "~8 million registered, estimated 1-2 million unregistered"
  augmentation: |
    Roughly 80% of the registered population has some form of augmentation, ranging
    from basic neural interfaces (required for most employment) to full-body
    cybernetic reconstruction. The quality divide is stark: corporate augments are
    sleek, integrated, and regularly maintained. Street augments are salvaged,
    jury-rigged, and prone to rejection syndrome. Being unaugmented in Meridian is
    like being illiterate — technically survivable, practically crippling.
  languages:
    - "Meridian Standard (English-based corporate pidgin)"
    - "Shelf Cant (street slang, shifts weekly, partly encrypted)"
    - "Old Harbor Creole (mix of pre-collapse languages from refugee populations)"
    - "Machine Talk (AI-to-AI communication that sometimes bleeds into meatspace)"

governance:
  official: "Meridian City Council (12 seats, 11 corporate-appointed)"
  actual: "Axiom Industries Board of Directors"
  law_enforcement: "Axiom Security Solutions (privatized police)"
  justice_system: |
    Corporate arbitration for citizens with access level 3+. Municipal courts for
    everyone else, staffed by overworked public defenders and algorithms. The Shelf
    has no effective legal system — disputes are settled by the Iron Lotus, by
    violence, or by leaving. Old Harbor has no law at all, which is either its
    greatest danger or its greatest freedom, depending on who you ask.

infrastructure:
  transit:
    - "MeriRail: Automated monorail connecting major districts. Surveilled. Requires access credentials."
    - "Shelf Lifts: Cargo elevators repurposed for human transit in the vertical slum. Unreliable."
    - "Water Taxis: Boats connecting Old Harbor to the Shelf. Unlicensed, dangerous, cheap."
    - "Walking: The only truly private movement in Meridian. No cameras in the alleys. Yet."
  power: "Fusion grid managed by Axiom Energy. Rolling blackouts in lower tiers are 'scheduled maintenance.'"
  communications: "The Net — immersive, layered, and trapped. Corporate Net is curated. Street Net is a jungle."

districts:
  - the_shelf
  - the_meridian_core
  - the_circuit
  - old_harbor
  - the_spire

themes:
  - "Verticality as class metaphor — the higher you are, the more human you're allowed to be"
  - "Corporate language as camouflage for exploitation"
  - "The ocean as memory — what was lost, what refuses to stay buried"
  - "Augmentation as both liberation and leash"
  - "The absurdity of marketing hope in a city that runs on despair"

tone: |
  Meridian should feel like a place that's trying very hard to convince you it's
  fine. The satire lives in the gap between the branding and the reality — transit
  screens showing ads for luxury augments while the train floods, corporate
  wellness initiatives in a city where the air quality index is classified, customer
  service language applied to human suffering. It's darkly funny because the
  characters know it's absurd and are too tired to do anything but laugh. The city
  is not dystopian in the sense that it's uniformly grim — there's beauty here,
  community, love, art, noodle shops that have been open for thirty years. The
  tragedy is that all of it exists despite the system, not because of it.
