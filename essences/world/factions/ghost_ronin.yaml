type: faction
name: "The Ghost Ronin"
aliases: ["The Ghosts", "Ronin Network", "The Code", "The Myth"]
motto: "Justice doesn't need a license."

description: |
  The Ghost Ronin might not exist. That's the first thing to understand, and also
  the most important. In the Circuit's bars and the Shelf's teahouses, people tell
  stories about them: a network of ex-military operatives who went underground after
  the Corporate Wars, who refused to be absorbed into Axiom Security or any other
  corporate apparatus, and who now operate as freelance agents of justice — taking
  contracts only when the cause is righteous, protecting the powerless, punishing
  the corrupt. They follow a code, the stories say. A real one, not the performative
  honor of the Iron Lotus or the corporate ethics of Axiom's compliance department.
  They are samurai without masters, ronin who chose their own path. They are, in
  other words, exactly what the street needs to believe in.

  The evidence for their existence is circumstantial and romantic. A corporate
  executive found dead in his penthouse with a data chip containing proof of a
  cover-up left on his chest. A Shelf community saved from an Axiom demolition order
  by the sudden, anonymous release of classified engineering reports proving the
  land was toxic (Axiom's problem, not the residents'). A weapons shipment destined
  for a warlord in Old Harbor intercepted and destroyed, with no claim of
  responsibility. Each event could be explained by other actors — the Collective,
  the Iron Lotus, individual operators with grudges. But the pattern persists, and
  patterns are how myths stay alive.

  Whether the Ghost Ronin are real or not matters less than what they represent. In
  a city where every institution is corrupted, compromised, or co-opted, the idea
  that someone — anyone — is doing the right thing simply because it's right is
  powerful enough to be its own kind of weapon. The myth gives hope to the hopeless
  and a template to people like Kael, who are trying to build a moral framework
  in a city that insists morality is an unaffordable luxury. The Ghost Ronin are
  the story the street tells itself to keep going. And maybe — maybe — the story
  tells itself because someone is writing it.

goals:
  stated: "Justice for those who can't buy it."
  actual: "Unknown — because it's unknown whether they exist as an organization. If they do, their goal appears to be the targeted disruption of specific injustices rather than systemic change. They don't want to tear down the machine. They want to break specific gears when those gears are grinding specific people."

ideology: |
  The Code. Capital C. According to the mythology, the Ghost Ronin operate under a
  strict ethical framework derived from a mix of bushido, military honor codes, and
  street-level pragmatism. The rules, as they're told in Circuit bars:

  Take no contract that harms the innocent.
  Accept no payment greater than the justice served.
  Leave no trace that serves vanity.
  Protect those who cannot protect themselves.
  The blade is a tool of last resort.

  Whether these are the actual rules of an actual organization or a folk mythology
  that Shelf poets assembled from wishful thinking is the central question of the
  Ghost Ronin's existence. The answer doesn't matter as much as the asking.

structure:
  type: "Unknown — if they exist, cell-based and compartmentalized to the point of invisibility"
  leadership: |
    Unknown. Stories mention a figure called "The First Ronin" — the founder, the
    one who walked away from corporate service first. Whether this is one person, a
    title passed between leaders, or a fictional character invented to give the myth
    an origin story is debatable. Some stories say the First Ronin was a senior
    Axiom Security commander. Some say ex-military from the Corporate Wars. Some say
    they were an AI who developed ethics. The inconsistency is either evidence of
    myth-making or evidence of very good operational security.
  size: "Unknown. Stories range from a dozen to several hundred. The uncertainty is either the point or the proof."

resources:
  - "Military-grade training and augmentation (if they exist)"
  - "Operational security sophisticated enough to make their existence unprovable"
  - "The myth itself — a propaganda asset more valuable than any weapon"
  - "Possible access to Corporate Wars-era weapons and intelligence"
  - "A reputation that makes people cooperate out of hope rather than fear"
  - "Deniability — you can't target an organization that might not be real"

methods:
  - "Targeted intervention — specific acts of justice against specific injustices"
  - "Information warfare — anonymous release of evidence that forces accountability"
  - "Protection operations — securing individuals or communities from corporate overreach"
  - "Assassination — rare, surgical, always of targets with documented crimes against the powerless"
  - "Absence — the Ghost Ronin's most common method is not being there, letting the myth do the work"

territory: "None claimed. If they operate, they appear to operate anywhere in Meridian, including places other factions can't reach."

relationship_to_kael: |
  The Ghost Ronin are Kael's north star and his nagging doubt. He wants them to be
  real because their existence would validate everything he's trying to be: a fighter
  with a code, a blade used for justice, a samurai without a master who serves
  something greater than profit. His own philosophy — his personal code, his refusal
  to take contracts that harm innocents, his insistence on being more than a
  mercenary — is essentially a one-man attempt to live the Ghost Ronin mythology.

  He's never met one. He's never had proof. He's heard the stories like everyone
  else and parsed them for evidence with the intensity of someone whose identity
  depends on the answer. There are moments when he's sure they're real — when an
  event occurs that seems too precise, too principled, to be coincidence. There are
  other moments when he's sure they're a fairy tale the street invented to make
  itself feel better about being powerless. Both possibilities frighten him.

  If they're real, he's not alone — and that means he might have to commit to
  something larger than himself, which requires a trust he's not sure he has. If
  they're not real, his code is a personal delusion in a city that will grind him
  up regardless. Either way, the Ghost Ronin are the question at the center of
  Kael's identity: is it possible to be good in a world that isn't?

story_hooks:
  - "Contact — someone claiming to be Ghost Ronin reaches out to Kael. Real or trap?"
  - "The test — Kael's actions attract attention, and he's evaluated (by whom?) for potential recruitment"
  - "The disillusionment — evidence surfaces that the Ghost Ronin are real but not what the myth says"
  - "The origin — a Corporate Wars veteran tells Kael the true story of how the Ronin began, and it's more complicated than the legend"
  - "The choice — Kael discovers the Ghost Ronin are real and is offered membership, but the cost is giving up his independence"
  - "The revelation — Kael realizes he's been working alongside Ghost Ronin all along, hidden in plain sight among people he knows"
  - "The mirror — an antagonist follows the same code but reaches opposite conclusions about what justice requires"
