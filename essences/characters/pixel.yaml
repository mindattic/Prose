type: character
name: "Unknown (legal identity purged)"
aliases: ["Pixel", "Pix", "that loud kid next door"]
role: "Neighbor / tech scavenger / reluctant sidekick / Kael's closest friend"
age: 19
status: "alive"
location: "The Shelf — Level 12, Unit 1207, directly adjacent to Kael's unit. The wall between them is thin enough that Kael can hear Pixel's music, soldering iron, and running commentary on whatever they're disassembling."
description: |
  Pixel is a controlled explosion of salvaged technology and nervous energy. They're slight — 5'6", wiry,
  the kind of build that comes from skipping meals when a project gets interesting. Their skin is a light
  brown, perpetually smudged with solder flux and thermal paste, and their natural hair (what's left of
  it) is buzzed short on the right side, grown out in uneven dark curls on the left, and streaked with
  a color that changes monthly depending on what dye they've scavenged. Currently: a violent, glitchy
  magenta that's already fading to pink at the roots.

  The augments are the first thing you notice. Pixel's left eye is a salvaged Axiom Industries corporate
  scanner — matte black, slightly too large for the socket, with a faint amber ring that pulses when it's
  processing. It was designed to scan inventory in a warehouse. Pixel repurposed it to read security
  systems, identify augmentation models, and spot structural weaknesses in hardware. It also gives them
  splitting headaches when it overclocks, which it does constantly because they pushed it past its specs.
  Their right hand and forearm are aftermarket — a patchwork prosthetic cobbled from three different
  manufacturer lines, matte grey with visible seams where the components don't quite match. It works
  beautifully. It looks like a junk drawer. Their ears are studded with micro-receivers that pick up
  local comm frequencies, and there's a thin data-port scar behind their right ear where they hard-jack
  into systems.

  First impression: an annoying kid who won't shut up and has too many blinking lights on their body.
  Deeper impression: a desperately clever person who has turned themselves into a Swiss Army knife because
  being useful is the only survival strategy they trust.
origins: |
  Pixel doesn't talk about before. Not out of trauma — or at least, not only out of trauma — but because
  they've decided that their life started when they arrived on the Shelf at fourteen, and everything before
  that belongs to someone who no longer exists.

  What can be pieced together: they were born in one of the mid-tier corporate residential blocks —
  probably NovaCorp West, based on the manufacturing stamps on their oldest augments. Their parents were
  low-level corporate employees, the kind who lived one performance review away from the street. When
  NovaCorp's residential division was liquidated during a merger, entire blocks were evicted overnight.
  Pixel was twelve. Their parents went into the labor lottery system — a corporate reallocation program
  that functioned, in practice, as a way to disappear people into offshore manufacturing without anyone
  asking questions. Pixel was processed as a dependent minor, assigned to a group home in the Grey Stacks,
  and ran away within a week.

  Two years on the street taught them that the only currency that mattered was being useful. They learned
  to scavenge e-waste from corporate dump sites, identify functional components, repair and resell. They
  learned to hack low-level security by trial and catastrophic error. They installed their first augment
  — a basic neural interface — themselves, in a squat, with a tutorial they found on a pirate data-node.
  They were thirteen. It got infected. They nearly died. They got better at sterile procedure after that.

  They arrived on the Shelf at fourteen, rented the cheapest unit they could find, and discovered that
  their neighbor was a silent, sword-carrying weirdo who came home smelling like other people's blood.
  Most people would have moved. Pixel was fascinated.
psychology:
  facet_weights:
    wound: 0.7
    ideal: 0.4
    id: 0.85
    shadow: 0.6
    mask: 0.8
    ghost: 0.5
  core_fears:
    - "Obsolescence — that technology will outpace them and they'll have nothing to offer"
    - "Abandonment — everyone they've attached to has disappeared. They expect Kael to vanish too."
    - "Stillness — if they stop moving, stop talking, stop working, the empty space fills with everything they've been outrunning"
  core_desires:
    - "To be indispensable — to someone, to anyone. Being needed is the closest thing to being safe."
    - "To understand Kael — this anachronistic warrior is a puzzle Pixel can't solve with tech, and that's maddening and magnetic"
    - "To build something that lasts — a device, a system, a relationship — in a world where everything is disposable"
  coping_mechanisms:
    - "Talking — constant, rapid, filling every silence because silence is where fear lives"
    - "Building — they process emotion through their hands. Sad? Disassemble a comm unit. Scared? Overclock a scanner."
    - "Humor — deflecting with jokes is cheaper than therapy and more available"
    - "Self-augmentation — literally rebuilding themselves, piece by piece, as if they can upgrade past their problems"
  blind_spots:
    - "They don't understand that Kael's refusal of augments isn't rejection of Pixel — it's a different philosophy"
    - "They think being useful and being valued are the same thing"
    - "They underestimate their own emotional intelligence — they read people better than they read code, but won't admit it"
    - "They treat their body as a platform, not a home. The headaches, the glitches, the power drain — they ignore all of it."
  secret: |
    They found their parents. Six months ago, a deep-net data scrape turned up matching biometric records
    in a NovaCorp offshore manufacturing facility in the Mindanao Economic Zone. Alive. Working. Not
    looking for their child. Pixel has the facility's address saved in an encrypted file they open
    sometimes at 3 AM and then close without doing anything. They have not told anyone.
appearance:
  physical: |
    5'6", wiry, light brown skin. Asymmetric hair: buzzed right side, curly left side dyed in rotating
    scavenged colors (currently fading magenta). Quick, fidgety movements — they bounce their knee, tap
    surfaces, spin small tools between their fingers. Dark circles under their natural right eye from
    chronic sleep deprivation. A constellation of small scars on their hands and forearms from soldering
    burns and component edges. They favor cargo pants with too many pockets and layered tank tops that
    show off the arm prosthetic, which they're proud of the way an artist is proud of a sculpture.
  augmentations: |
    Extensive, cheap, self-installed, functional but glitchy:
    - Left eye: Salvaged Axiom Industries XT-400 inventory scanner, repurposed. Amber pulse ring.
      Overclocks frequently, causing migraines and occasional visual artifacts (they see ghost-data,
      phantom inventory tags floating in their vision).
    - Right hand/forearm: Patchwork prosthetic assembled from NovaCorp, Kenshin, and unknown-manufacturer
      components. Full dexterity, enhanced grip strength, built-in micro-tools (screwdriver heads,
      wire stripper, soldering tip that deploys from the index finger). Occasionally locks up in cold
      weather when the Kenshin servo motors disagree with the NovaCorp housing.
    - Micro-receivers in both ears: Passive comm-frequency scanners. Always on. Pixel hears fragments
      of other people's conversations like background music.
    - Data-port (behind right ear): Hard-jack interface for direct system access. The scar tissue
      around it is thick — they've jacked in too many times without proper port maintenance.
    - Basic neural interface: The first augment, the infected one. It works, but it hiccups — sometimes
      their train of thought literally skips, like a scratched disc, and they lose two or three seconds.
  distinctive_features:
    - "The mismatched eyes — one dark brown, one matte black with amber pulse"
    - "The patchwork arm, visibly assembled from different manufacturers"
    - "Constantly spinning a small tool or component between their fingers"
    - "The fading hair dye"
    - "A nervous laugh that kicks in when they're actually scared"
daily_life:
  routine: |
    Pixel doesn't have a routine so much as a pattern of controlled chaos. They sleep in bursts — three
    hours here, two hours there, naps on the workshop floor when a project stalls. They wake when their
    neural interface pings them with a buy order from the Circuit, or when Mrs. Chen bangs on the wall
    to tell them breakfast is available.

    Mornings (if they're awake): scavenging runs to the corporate e-waste zones in the Grey Stacks.
    This is technically illegal — corporate waste is corporate property — so it involves dodging security
    drones and perimeter sensors. Pixel treats this as a game. They fill a salvage bag with components,
    sort them at home, and list the viable ones on black-market boards.

    Afternoons: repair work. Shelf residents bring them broken augments, cracked screens, fried comms
    units. Pixel charges on a sliding scale — full price for anyone who can afford it, trade-for-services
    for those who can't. This is also when they work on personal projects, which range from practical
    (a signal booster for the Shelf's pirate mesh network) to absurd (an attempt to build a drone from
    a discarded ceiling fan and a navigation chip).

    Evenings: Chen's for dinner (paid in tech support). Then either night-scavenging, late-night hacking
    on low-security corporate networks for resellable data, or sitting on the Shelf's exterior scaffolding
    with their legs dangling over the drop, scanning frequencies and listening to the city breathe.
  habits:
    - "Spins tools between their fingers constantly — screwdrivers, wire strippers, anything cylindrical"
    - "Names their projects (the ceiling-fan drone is 'Gerald')"
    - "Hums or mutters while working, narrating their own process like a tutorial for an invisible audience"
    - "Brings Kael unsolicited 'gifts' — salvaged tech, repaired devices — that Kael never asked for and rarely uses"
    - "Checks the encrypted file with their parents' location at 3 AM, then closes it"
relationships:
  - name: "Kael"
    type: "neighbor / one-sided friendship / fascination"
    description: |
      Pixel is magnetically drawn to Kael's anachronism. In a world where everyone is augmented, connected,
      and optimized, Kael moves through space like a relic — blade, discipline, silence. Pixel finds this
      infuriating and beautiful. They keep trying to help, offering tech upgrades, tactical data, security
      hacks, and Kael keeps refusing, and Pixel keeps offering, because the offering is the point. It's how
      they say "I see you and I don't want you to die." Kael would describe Pixel as "the loud neighbor."
      Pixel would describe Kael as "my friend," full stop, no qualifications.
  - name: "Mrs. Chen"
    type: "surrogate grandmother / employer of sorts"
    description: |
      Mrs. Chen tolerates Pixel the way a building tolerates weather — with endurance and occasional
      structural complaints. But she also feeds them extra on bad days, lets them sleep in the back of
      the shop when their unit's power goes out, and once chased off a debt collector with a cleaver on
      Pixel's behalf. Pixel maintains her shop's electrical systems, refrigeration, and the ancient point-
      of-sale terminal. They are the closest thing either has to family, disguised as a business arrangement.
  - name: "Sable"
    type: "client / cautious professional respect"
    description: |
      Pixel does occasional tech work for Sable — data recovery, device cracking, security analysis.
      Sable pays well and on time, which earns Pixel's professional loyalty. But Pixel is also slightly
      terrified of Sable — not because Sable has ever threatened them, but because Sable is so perfectly
      controlled that Pixel's pattern-recognition reads them as a closed system. You can't read someone
      who's decided to be unreadable.
  - name: "Parents (unnamed)"
    type: "absent / unresolved"
    description: |
      The wound Pixel built themselves around. Every augment, every skill, every joke is load-bearing
      structure over the hole where parental love was supposed to go. They don't talk about it. They
      talk about everything else instead, loudly, at length, to fill the space.
speech_patterns:
  vocabulary: "Dense with tech jargon, slang, neologisms. They use technical metaphors for emotional states — 'I'm overclocking,' 'my buffer's full,' 'that's a hard reboot situation.' They've invented personal slang that nobody else uses but everyone on the Shelf has learned to parse. Heavy use of rhetorical questions that they answer themselves."
  cadence: "Rapid-fire, barely pausing for breath. Sentences pile up like components on a workbench. They interrupt themselves, double back, follow tangents, and somehow arrive at the point through the scenic route. When they're scared or lying, they speed up. When they're genuinely processing something emotional, they slow down — and the sudden silence is alarming because it's so rare."
  example_lines:
    - "Okay but hear me out — what if, and this is just a concept, a proof-of-concept really — what if your sword had a targeting assist? No? No. Cool. I already built it though, so, just... it's here. If you want it. You don't want it. That's fine."
    - "You know your problem? You've got legacy hardware running a bleeding-edge moral operating system. The specs don't match. Something's gonna crash."
    - "I don't sleep, I defragment. It's basically the same thing except less restful and more productive."
    - "Mrs. Chen says I talk too much, which, statistically speaking, is probably true, but also, counterpoint — have you considered that everyone else talks too little?"
    - "I'm not following you, I'm going the same direction. It's a small Shelf. Coincidences happen. Frequently. At exactly your walking speed."
    - "I'm fine. Everything's nominal. My eye is just doing that thing where it shows me inventory data for crates that don't exist. It's a feature, not a bug. It's definitely a bug."
  quirks:
    - "Answers their own rhetorical questions"
    - "Names inanimate objects and refers to them like colleagues"
    - "Uses 'listen' as a sentence opener even when nobody was talking"
    - "Makes finger-guns when they've successfully fixed something"
    - "Goes suddenly, completely silent when something genuinely upsets them — the absence of noise is the tell"
narrative_function: |
  Pixel is Kael's mirror — same orphan origin, opposite coping strategy. Where Kael retreated into
  discipline and silence, Pixel exploded outward into noise and technology. They represent the question:
  what would Kael have become without Tanaka? Not worse, necessarily — just different. Pixel survived
  without a code, without a mentor, without a sword. They survived by being useful, by being fast, by
  being loud enough that no one could ignore them.

  Pixel also represents the generation that inherited the Consolidation Wars without fighting them.
  They don't have Kael's martial trauma or Tanaka's guilt or Mrs. Chen's grief. They have something
  arguably worse: they grew up in the aftermath and were told this was normal. Their rebellion isn't
  philosophical — it's practical. They scavenge and hack and build because the system wasn't designed
  to include them, so they'll include themselves.

  The question Pixel poses to Kael: Can you protect someone who doesn't fight the way you do? Can
  your code accommodate someone whose weapon is a soldering iron instead of a sword?
story_hooks:
  - "Pixel's parents — the Mindanao facility, the choice to make contact or not, what happens if they do"
  - "Pixel's augments failing catastrophically — the scanner eye, the arm. What happens when the machine body breaks?"
  - "Someone powerful noticing Pixel's skills and trying to recruit them — the temptation of corporate stability"
  - "Pixel following Kael on a job and seeing what he actually does — the violence, the code, the reality behind the quiet neighbor"
  - "Pixel building something genuinely dangerous — accidentally or on purpose — that draws corporate attention to the Shelf"
  - "The neural interface's 'skip' getting worse — losing seconds becoming losing minutes, then hours"
