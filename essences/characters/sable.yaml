type: character
name: "Sable"
aliases: ["The Broker", "Nobody's Friend", "that voice on the encrypted line"]
role: "Fixer / contract broker / Kael's primary employer"
age: 40
status: "alive"
location: "The Circuit — operates from a rotating series of back rooms in the black market district. Never the same room twice in a month."
description: |
  Nobody can agree on what Sable looks like. That's by design. Facial recognition blockers embedded
  beneath their cheekbones scatter biometric readings into static. Voice modulators shift their timbre
  between conversations — sometimes a warm baritone, sometimes a clipped alto, always controlled. They
  dress in layers of unremarkable clothing — not disguises, just aggressively average. Dark jacket,
  neutral shirt, trousers that could belong to anyone. You could sit across from Sable for an hour and
  describe them afterward as "medium height, medium build, forgettable face" and you'd be exactly right
  and completely useless to anyone looking.

  What people do remember is the rhythm. Not the voice itself (that changes) but the cadence — the way
  every sentence sounds like a contract clause, every pause strategically placed, every word carrying
  exactly the weight Sable intends and not an ounce more. When they make you an offer, you know the
  number is final because it sounds like it was calculated by an actuarial algorithm. It wasn't. Sable
  just practiced until it sounded that way.

  Their hands are the one consistent tell. Long-fingered, precise, always perfectly still when they're
  talking. No nervous gestures, ever. The kind of hands that belong to someone who learned long ago that
  fidgeting is a leak in the hull of composure. If you're sharp enough to notice the hands, you're sharp
  enough to be worth Sable's time.
origins: |
  Before the Circuit, Sable was corporate. Mid-level management at an Axiom Industries logistics
  subsidiary — the kind of role that required knowing everyone, owing no one, and making complicated
  things happen on schedule. They were good at it. Good enough that when their entire division was
  "restructured" — dissolved overnight, pensions voided, NDAs enforced at gunpoint — they had a network
  worth salvaging from the wreckage.

  Three hundred people lost everything in that restructuring. Severance was a locked door and a security
  escort to the elevator. Sable watched their colleagues — people who'd given decades to the company —
  walk out carrying personal effects in corporate-branded recycling bags. Something broke that day,
  quietly and permanently, in the place where Sable kept their faith in institutional loyalty.

  They didn't rage. They didn't grieve, at least not visibly. They took their corporate network — every
  contact, every favor owed, every back-channel relationship cultivated over a decade of corporate
  politics — and moved it underground. The transition from corporate logistics to criminal brokerage
  was disturbingly seamless. The same skills that made them a competent middle manager made them an
  exceptional fixer: personnel assessment, risk calculation, supply chain management, and the ability
  to sit across from dangerous people and speak in a tone that made them feel like a client rather
  than a threat.

  They've been working the Circuit for fourteen years. They've never been arrested. They've never been
  positively identified by corporate security. And they've never sent an operative on a job without
  full disclosure of the risks — because the one thing the restructuring taught them is that the
  cruelest thing an institution can do is lie to you about the odds.
psychology:
  facet_weights:
    wound: 0.5
    ideal: 0.55
    id: 0.35
    shadow: 0.8
    mask: 0.95
    ghost: 0.4
  core_fears:
    - "Being known — truly known, without the blockers, without the modulated voice, without the layers"
    - "That the transactional life has hollowed them out completely — that there's nothing left under the mask"
    - "Getting old or slow enough that someone traces them back to a real name, a real face"
    - "That they've become exactly what the corporation was — a system that uses people efficiently and calls it service"
  core_desires:
    - "Control — over information, outcomes, visibility. Control is the only security that can't be restructured away."
    - "A clean exit — someday, hypothetically, a life that doesn't require calculating every human interaction"
    - "To believe they're different from Axiom. (They might not be.)"
    - "One honest conversation with someone who doesn't want anything from them. They haven't had one in years."
  coping_mechanisms:
    - "Treating everything as a transaction — removes emotional risk, flattens human connection into manageable data"
    - "Physical anonymity — if nobody sees you, nobody can hurt you, nobody can restructure you"
    - "Meticulous record-keeping — a physical notebook in a cipher only they can read. Unhackable. The one thing they trust."
    - "Cooking elaborate meals alone in whatever safe room they're occupying — French technique, West African spices, eaten in silence"
  blind_spots:
    - "They think pragmatism is wisdom. Sometimes it's just cowardice in a better suit."
    - "They can't see that paying fairly and disclosing risks IS a code — they'd deny having one if you pointed it out"
    - "They don't realize that their respect for Kael is the closest thing they have to friendship"
    - "They believe they chose this life. They didn't. They fled into it the way Kael fled into the sword."
  secret: |
    Once a year, on the anniversary of the restructuring, Sable goes to the Meridian Core and stands
    outside the building where they used to work. It's a restaurant now — upscale, reservation-only,
    the kind of place that serves deconstructed things on slate. They stand there for exactly one hour,
    in the rain or not, and then leave. They don't know why they do this. They can't stop doing it.
    It's the only appointment in their year that isn't transactional, and it terrifies them.
appearance:
  physical: |
    Deliberately unremarkable. Medium height, medium build. The face is pleasant and immediately
    forgettable — partly natural bone structure, partly the subdermal biometric scramblers doing
    their work. Short hair, neat but unstyled. Could be anywhere between 35 and 50. Skin tone
    that scanners can't quite pin down because the facial blockers interfere with pigment reading.
    Clean, well-maintained hands with no rings, no scars, no distinguishing marks. They are the
    absence of distinctive features elevated to an art form.
  augmentations: |
    Subtle, expensive, invisible — the opposite of Pixel's approach:
    - Subdermal facial recognition blockers (cheekbones, jawline): Scatter biometric readings,
      making their face unmappable by any commercial or military-grade scanner. People who meet
      Sable on Monday genuinely cannot describe them on Tuesday.
    - Voice modulator (throat implant): Can shift timbre, pitch, accent, and cadence on demand.
      Sable uses different voice profiles for different clients. None of them are the original.
    - Encrypted comms implant (behind right ear): Military-grade, regularly updated, with a
      kill-switch that fries the hardware if tampered with.
    - Stress-response dampener (adrenal gland): Keeps heart rate and cortisol stable under
      pressure. Sable can sit across from someone pointing a gun at them and negotiate calmly.
      This is not bravery. This is pharmacological architecture.
    - All augments are high-end, regularly maintained by a private technician who doesn't know
      Sable's name. Nothing about Sable looks augmented. That's the entire point.
  distinctive_features:
    - "Nothing. That IS the distinctive feature."
    - "If pressed: the hands. Long-fingered, always still. People remember the hands without remembering the face."
    - "The rhythm of speech — not the voice, which changes, but the cadence, which doesn't"
daily_life:
  routine: |
    Sable has no fixed address that anyone knows. They rotate between safe rooms across the Circuit,
    the Shelf's lower levels, and locations that exist on no map. Morning is information gathering —
    encrypted news feeds, debt records, incident reports, corporate chatter scraped from compromised
    channels. They cross-reference everything. They spot patterns the way Kael spots threats — by
    instinct sharpened into science.

    Midday: client meetings, always in neutral locations, always with pre-arranged exit routes. They
    meet each client as a slightly different person — different voice, different mannerisms, same
    rhythm. Afternoon: operative management. Checking on active jobs, adjusting timelines, handling
    complications with the calm of someone who budgeted for complications. A job goes sideways? That
    was factored in. An operative misses check-in? There's a protocol.

    Evening: the books. Payment processing, account reconciliation, risk assessment for tomorrow's
    slate. Then they cook. In whatever safe room they're using, with whatever kitchen is available,
    Sable prepares elaborate meals — groundnut stew with perfect roux, coq au vin reduced for three
    hours, jollof rice that would make their grandmother weep. They eat alone. They are an excellent
    cook. Nobody has ever tasted their food.
  habits:
    - "Arrives exactly on time. Never early, never late. Punctuality is the one promise that costs nothing."
    - "Sits with their back to the wall, facing the door and the nearest exit"
    - "Offers precisely one piece of free advice per meeting — the advice is always good and always unwelcome"
    - "Keeps a physical notebook in a personal cipher. Updates it nightly. The only record of who Sable really is."
    - "Never drinks anything they didn't pour themselves"
relationships:
  - name: "Kael"
    type: "employer / closest thing to respect"
    description: |
      Sable has worked with Kael for four years. They think his code is commercially stupid — turning
      down profitable contracts because of principles costs them both money. "You're leaving money on
      the table, but at least you're consistent." But they've never pushed too hard, because they
      recognize in Kael's stubbornness something they lost in themselves — a willingness to be
      inefficient for the sake of meaning. They always pay Kael on time. They never lie about the
      risks. They sometimes steer the better jobs his way, and if asked, they'd call it asset
      management. It's more than that. Kael is the one operative Sable has never treated as fully
      fungible, and that keeps Sable up at night.
  - name: "Pixel"
    type: "occasional hire / mild amusement"
    description: |
      Sable hires Pixel for tech work — data recovery, device cracking, security bypasses. The kid
      is cheap, fast, and talks too much. Sable finds the chatter oddly soothing, though they'd
      incinerate their notebook before admitting it. Pixel's chaos is the inverse of Sable's
      control, and there's something restful about proximity to someone who hasn't learned to
      mask yet.
  - name: "Axiom Industries"
    type: "former employer / current client pool / quiet nemesis"
    description: |
      Half of Sable's clients are corporate — Axiom departments that need things done off-book.
      Sable takes their money and uses their information. There's a deep, acidic irony in being
      better at corporate logistics as a criminal than they ever were as an employee. Every Axiom
      contract is a small revenge they never acknowledge.
  - name: "The Circuit's operators"
    type: "professional network / mutual deterrence"
    description: |
      Sable knows every major player in the Circuit's economy — other fixers, gang leadership,
      black-market wholesalers, corrupt corporate liaisons. They maintain these relationships the
      way a diplomat maintains treaties: carefully, without affection, with full awareness that any
      of them could collapse overnight. They are respected. They are not liked. They prefer it that way.
speech_patterns:
  vocabulary: "Corporate jargon repurposed for the underground with dark, dry irony. 'Restructure' means kill. 'Optimize' means clean up evidence. 'Deliverable' means the target. It's the language of boardrooms applied to back-alley crime, and it serves two purposes: it keeps emotion at arm's length, and it reminds Sable, every day, of what made them."
  cadence: "Measured, transactional, calm. Every sentence sounds like it was drafted by legal. Pauses are strategic, not hesitant. They never raise their voice. When they're angry, they speak more slowly and more precisely — the words get shorter, the silences get heavier, and the person across from them starts to sweat."
  example_lines:
    - "The job pays twelve. Non-negotiable. The risk premium is already factored in."
    - "You're leaving money on the table with that code of yours. But at least you're consistent. Consistency is undervalued in this market."
    - "I don't have friends, Kael. I have reliable assets and unreliable assets. You're reliable. That's not nothing."
    - "I won't lie to you about the odds. I might lie about everything else, but never the odds."
    - "I don't judge the work. I judge the people. You'd be surprised how rarely those two things align."
    - "The client wants it done by Friday. I told them Saturday. That gives you margin. You're welcome. It's coming out of my fee."
  quirks:
    - "Uses 'we' when referring to market conditions — 'We're paying eight for extraction this quarter'"
    - "Offers exactly one free piece of advice per conversation, always phrased as observation rather than recommendation"
    - "Never uses contractions when discussing business. Only when caught off-guard does the speech loosen."
    - "Refers to death as 'permanent restructuring' — it might be a joke. Nobody has ever been sure."
    - "Taps the table once, lightly, with one finger when a meeting is over. It's the only gesture they make."
narrative_function: |
  Sable is what Kael could become if he abandoned the code — competent, successful, invisible, and
  hollow. They represent pragmatism taken to its logical extreme: a person who has optimized away their
  own humanity in exchange for control and survival. They are the corporate machine's ghost — someone
  who left the corporation but brought its operating system with them.

  But Sable is also the story's most honest character. They don't pretend to be noble. They don't
  dress up what they do in philosophy or tradition. They broker violence for money and they do it
  with transparency and fair pay, which makes them, by the Circuit's standards, practically a saint.
  The question is whether that low bar is enough to constitute a moral life.

  Sable poses this question to Kael: Is your code a luxury? Can you afford principles in a world
  that prices them at zero? And the follow-up, which Sable would never ask aloud: If you can afford
  them and I can't, what does that say about which of us is really trapped?
story_hooks:
  - "A contract goes catastrophically wrong and Sable needs Kael to clean up — but the cleanup requires breaking his code"
  - "Sable's identity is compromised — someone is close to tracing them to a real name. They need to disappear or fight, and they've never had to fight."
  - "They offer Kael a job working directly for Axiom. The pay is life-changing. The target makes it impossible."
  - "Sable's annual visit to the old office building is observed. Someone from their old life recognizes the hands."
  - "A client defaults and targets Sable — the fixer becomes the job, and the only operative they trust is Kael"
  - "Sable cooks for someone. It's the most vulnerable thing they've ever done."
