type: character
name: "Yuki Tanabe"
aliases: ["Lieutenant Tanabe", "Yuki", "The Ex"]
role: "Former romantic partner / Axiom security operative / the path not taken"
age: 29
status: "alive"
location: "Meridian Core — Axiom Industries Security Division, Floor 47. Clean apartment in the corporate residential block, Level 30."
description: |
  Yuki moves like someone who has been evaluated her entire adult life and has decided to make every
  evaluation flawless. Not arrogant — precise. Every step measured, every gesture controlled, every
  word vetted by some internal review board that never adjourns. She is 5'8", athletic, with the
  particular build that comes from corporate training programs designed to maximize combat efficiency
  without sacrificing the professional appearance Axiom demands of its security personnel. Her black
  hair is kept in a regulation-length bob that frames a face built for stillness — high cheekbones,
  dark eyes that assess before they acknowledge, a mouth that defaults to a neutral line that gives
  away nothing.

  Her uniform is always immaculate. Her augments are always calibrated. Her quarterly performance
  reviews are always exceptional. She is, on paper and in practice, the model Axiom operative: a
  product of the Shelf who climbed out through sheer competence and disciplined compliance. The
  corporation holds her up as proof that the system works — that anyone with talent and willingness
  can ascend. They do not mention what she had to leave behind to do it.

  First impression: a professional. Competent, controlled, slightly cold. The kind of person you
  respect and don't approach. Second impression, available only to those who knew her before: a
  woman who is performing the role of herself with such precision that the performance has become
  indistinguishable from reality. She's not pretending. She's not honest either. She's something
  worse — she's forgotten where the mask ends.
origins: |
  Born on the Shelf. Her parents were mid-tier — her father ran a small repair shop, her mother
  worked in waste processing. They weren't poor by Shelf standards, but Shelf standards meant the
  ceiling leaked, the water was brown twice a week, and medical care was whatever Mrs. Chen's
  predecessor could stitch together in a back room. Yuki grew up knowing exactly what the world
  looked like from the bottom, and she decided, with the quiet ferocity of a child who has counted
  the cracks in every ceiling she's slept under, that she would not stay.

  She enlisted in Axiom's military program at seventeen. The recruiter came to the Shelf — they
  always did, trolling for talent in places where talent had no other exit. Yuki tested in the top
  percentile. She was fast, disciplined, and possessed of a tactical intelligence that her
  instructors called "instinctive" but was actually the product of a childhood spent calculating
  odds in a place where miscalculation meant going hungry.

  She met Kael during their second year in the program. He was the best close-combat operative in
  the unit — fast, silent, frighteningly skilled with a blade in ways the program hadn't taught him.
  She was the best tactical planner — the one who could read a room, a building, a district, and
  find the seam where pressure would open it. They were assigned together for eighteen months. The
  relationship was inevitable — two people who trusted no one deciding to trust each other in a
  system designed to atomize loyalty.

  Then the refugee camp operation happened. Kael saw something — or was ordered to do something —
  that broke whatever accommodation he'd made with the corporate military. He left. She didn't.
  He asked her to come. She said no. Not because she didn't see what he saw, but because she'd done
  the math: leaving meant the Shelf, meant poverty, meant everything she'd clawed her way out of.
  Staying meant complicity, but complicity with healthcare, a locked door, and a future that
  extended past next week.

  She chose the future. It was the smart choice. She tells herself this every morning during the
  thirty-seven minutes she lies awake before the alarm.
psychology:
  facet_weights:
    wound: 0.7
    ideal: 0.8
    id: 0.5
    shadow: 0.75
    mask: 0.9
    ghost: 0.55
  core_fears:
    - "That Kael was right to leave — that his moral clarity is real and hers is theater"
    - "That she has become exactly what killed the communities she grew up in — the system's enforcement arm"
    - "Losing control — of her career, her emotions, her carefully constructed life. One crack and it all falls."
    - "Being sent back to the Shelf — not physically, but spiritually. Becoming powerless again."
  core_desires:
    - "Security — real, permanent, unshakable. The kind that can't be taken away by a policy change or a restructuring."
    - "To prove that working within the system is more effective than fighting it from the margins"
    - "To feel something again without it threatening everything she's built"
    - "To hear Kael say she made the right choice — because his opinion still matters, and she hates that it does"
  coping_mechanisms:
    - "Over-performance — be so excellent they can never discard you. Outwork the doubt."
    - "Physical training: 0600, every day, no exceptions. The body is the one thing she can control completely."
    - "Emotional compartmentalization — she calls it 'operational focus.' It's a filing system for feelings she can't afford."
    - "Reading poetry alone at night with the lights off — Basho, Rumi, Warsan Shire. She'd rather die than let anyone know."
  blind_spots:
    - "She thinks loyalty to Axiom is the same as integrity. It's not. It's employment."
    - "She can't see that her 'choice' and Kael's 'choice' were both survival — just different calculations of the same fear"
    - "She assumes Kael left because he was weak, because he couldn't handle the work. He left because he was horrified. She can't let herself see the difference, because then she'd have to ask why she wasn't."
    - "She doesn't realize that her isolation is the system working as designed — atomized employees don't organize, don't question, don't leave"
  secret: |
    She keeps a file on Kael. Not an official one — a personal file, on a private device, encrypted
    with a key she changes monthly. Every job he takes that crosses Axiom's radar, every sighting,
    every rumor. She's tracked his movements for five years. She tells herself it's professional
    due diligence — knowing where a former operative operates is standard security practice. It's
    not. She's watching him the way you watch someone who jumped off a bridge — not because you
    want to jump, but because you need to know if they survived the fall.
appearance:
  physical: |
    5'8", athletic, broad-shouldered. Black hair in a regulation bob. Dark eyes that assess before
    they engage. Strong jaw, clear skin, the kind of face that photographs well for corporate
    materials and gives away nothing in person. She carries herself with perfect posture — not stiff,
    but aligned, like someone who was measured for a uniform and decided to become the measurement.
    When she's not in uniform, she wears clean, simple clothes — the kind that say "I can afford
    better but choose not to." Her hands are always clean. Obsessively clean. She washes them
    more than necessary, a control ritual she doesn't acknowledge.
  augmentations: |
    Full Axiom military suite, latest generation. Everything Kael's augments were, fifteen years
    more advanced and properly maintained:
    - Neural-enhanced reflexes: Response time reduced to near-theoretical minimum. She can process
      and react to threats faster than unaugmented humans can perceive them.
    - Dermal armor plating: Forearms, torso, and upper thighs. Invisible under clothing, capable
      of stopping low-caliber rounds and absorbing blade strikes.
    - Retinal targeting overlay: Heads-up display with threat assessment, biometric reading, and
      tactical mapping. She sees the world annotated with data.
    - Encrypted comms: Corporate-grade, regularly cycled, with priority channels to Axiom command.
    - Biometric access: Every Axiom facility, every security tier. Her body is a keycard.
    - Everything is clean, current, maintained on a corporate schedule by certified technicians.
      Her augments don't glitch. They don't ache. They don't remind her they're there.
      That's what money buys.
  distinctive_features:
    - "Moves with military precision even off-duty — turns are sharp, posture geometrically perfect"
    - "A small tattoo on her inner left wrist — a wave pattern, from a trip to Old Harbor she took with Kael. She's never had it removed."
    - "Her hands are always clean. She washes them constantly, at every opportunity."
    - "When she's off-duty, she touches the tattoo without realizing it"
daily_life:
  routine: |
    0500: Wake. Thirty-seven minutes of lying still, staring at a clean ceiling, thinking about
    nothing and everything. 0537: Up. 0600: Training — combat drills, firearms qualification,
    augment calibration. Alone. She trains alone by choice, though the official reason is "schedule
    optimization." 0730: Nutrition — optimized, portioned, flavorless. Food is fuel. She hasn't
    enjoyed a meal since the Shelf. 0800: Briefing. 0830-1800: Operations — patrol oversight,
    threat assessment, asset protection, incident response. Sometimes fieldwork. She's good in the
    field. Very good. Better than Kael in some ways, because she doesn't have a code weighing her
    down, slowing her calculations with moral variables.

    1830: Debrief. 1900: Personal maintenance — augment diagnostics, medical check, fitness metrics.
    2000: Alone in her apartment. It's clean. It's quiet. The door locks. The water runs clear. The
    climate control works. It is everything she wanted when she was a child on the Shelf, and it is
    not enough, and she does not allow herself to think about why.

    2100: She reads. Poetry, mostly. Physical books when she can find them, digital otherwise. She
    reads with the lights off, using her retinal display's ambient mode, because somehow the
    darkness makes it feel less like a confession. 2200: Lights out. She lies awake for exactly
    thirty-seven minutes. She's counted.
  habits:
    - "Washes her hands before and after every task — a control ritual disguised as hygiene"
    - "Keeps her apartment immaculate. Nothing out of place. Nothing personal visible. Visitors would think no one lives there."
    - "Writes operational reports significantly more detailed than required — precision as self-medication"
    - "Runs the perimeter of the Meridian Core every Sunday morning — 16 kilometers, alone, rain or not"
    - "Touches the wave tattoo when she's thinking. She doesn't know she does this."
relationships:
  - name: "Kael"
    type: "ex-partner / unresolved / professional adversary"
    description: |
      They haven't spoken in five years. She's seen him twice on operations — once across a crowded
      market during a surveillance sweep, once through a security feed during an incident in the
      Circuit. Both times she let him go. Both times she filed the sighting as "unconfirmed." She
      doesn't examine why. The relationship was the most honest thing in her life, and when it ended,
      she sealed the room where it lived and hasn't opened the door since. But she keeps the key.
      The tattoo. The file. The thirty-seven minutes every morning.
  - name: "Axiom Industries"
    type: "employer / identity / cage"
    description: |
      Axiom is her world. It gave her augments, a career, a clean apartment, a locked door, and a
      purpose that doesn't require her to ask difficult questions as long as she doesn't look too
      closely at the answers. It also systematically grinds the communities she came from — places
      like the Shelf — under its operational requirements. She knows both things. She keeps them in
      separate compartments and never lets them meet.
  - name: "Her parents (deceased)"
    type: "origin / motivation / guilt"
    description: |
      Her father died when she was fourteen — a workplace accident at the docks that Axiom classified
      as "operator error" to avoid liability. Her mother died three years later, worn through by
      double shifts at an understaffed clinic. Yuki enlisted within months. She never says their
      names. She sends money to maintain their graves on the Shelf, through an anonymous account,
      because going in person would mean seeing what she left.
  - name: "Commander Zhao"
    type: "superior officer / mentor"
    description: |
      Her commanding officer. Competent, fair within the system's definition of fairness, and
      absolutely loyal to Axiom. He sees Yuki as his best operative and his likely successor. He
      has no idea about the private file on Kael. If he found out, her career would be over in hours.
      She respects Zhao. She does not trust him. She doesn't trust anyone. That's the training working.
speech_patterns:
  vocabulary: "Military-corporate hybrid. Clean, precise, stripped of imagery, heavy on clarity. She uses rank and protocol language even in casual conversation — it's armor. When she's caught off-guard, fragments of Shelf dialect surface ('that's gutter—' she'll start, then correct to standard phrasing immediately, furious at the slip). She never swears. She considers it imprecise."
  cadence: "Controlled, even, delivered at the same volume and speed regardless of content. She could be ordering dinner or ordering a tactical strike and it would sound identical. When she's angry, she gets quieter — the words get shorter, the pauses get longer, and the most dangerous Yuki is the one who stops talking entirely and just looks at you."
  example_lines:
    - "You left. That's your prerogative. I stayed. That's mine. We don't need to discuss it further."
    - "I sleep fine, Kael. I sleep in a bed with clean sheets in a room with a lock. I sleep fine."
    - "The objective is clear. The method is your discretion. The timeline is not."
    - "I didn't leave the Shelf to have opinions about the Shelf. I left to never go back."
    - "You think your code makes you better than me. It doesn't. It just makes you poorer."
    - "Don't ask me if I'm happy. That's not a relevant metric."
  quirks:
    - "Corrects herself when Shelf slang slips out — the correction is always faster and angrier than the slip"
    - "References operational time even in casual conversation — 'I have nine minutes'"
    - "Never sits unless the room is secured and she's identified all exits"
    - "When truly distressed, reverts to single Japanese words whispered under her breath — fragments of her mother's language"
    - "The repeated claim that she sleeps fine. She says it too often for it to be true."
narrative_function: |
  Yuki is the road not taken. She is what Kael would be if he'd stayed with Axiom — successful,
  stable, effective, and slowly being consumed by the machine she chose. She represents the argument
  that principles are a luxury, that pragmatism is survival, that the system is ugly but it works
  for those willing to work it.

  But she also mirrors Kael's hypocrisy from the other side. He calls himself a samurai while doing
  mercenary work. She calls herself an officer while enforcing corporate will on communities like
  the one she grew up in. Neither of them is fully honest about what they are. But Yuki's dishonesty
  is state-sponsored, which makes it invisible, and Kael's is self-imposed, which makes it romantic.
  The story should question both.

  She is the tension between where you came from and what you became. She buried the same moral
  doubts Kael couldn't swallow. She chose pragmatism. It works. She has healthcare. She has security.
  She has a clean ceiling to stare at for thirty-seven minutes every morning while she doesn't think
  about whether any of it was worth it.

  The question she poses to Kael: Was leaving brave, or was it easy? Was staying cowardly, or was
  it the harder choice — to look at the machine every day and keep going? The story should make
  both answers feel true and neither feel sufficient.
story_hooks:
  - "Kael and Yuki on opposite sides of the same job — she's protecting what he's been hired to steal"
  - "Axiom orders Yuki to bring Kael in. She has to choose between her career and the person she was before she had one."
  - "Commander Zhao discovers the private file. Yuki faces termination unless she turns Kael in — with real intel this time."
  - "She shows up at Mrs. Chen's noodle shop. She hasn't been to the Shelf since she left. Mrs. Chen recognizes her immediately."
  - "She reads a poem that cracks something open — and for the first time, she lets herself ask whether Kael was right"
  - "A Shelf operation she's ordered to command — clearing the area she grew up in. The same kind of action that made Kael leave."
