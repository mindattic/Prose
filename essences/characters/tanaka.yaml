type: character
name: "Tanaka Hiroshi"
aliases: ["Sensei", "The Old Man", "Ghost"]
role: "Mentor (deceased)"
age: 65
status: "deceased"
location: "Old Harbor (buried there); haunts Kael's memory everywhere"
description: |
  Tanaka was the kind of man you noticed by what he didn't do. He didn't fidget. He didn't raise
  his voice. He didn't waste a single motion pouring tea or drawing a blade. In a world of
  twitching augment-junkies and overcaffeinated hustlers, Tanaka moved like still water. He was
  lean, weather-beaten, his face a topographic map of old violence — a scar bisecting his left
  eyebrow where shrapnel had kissed him during the Kanto Corridor Offensive, a jaw that had been
  broken and reset slightly crooked. He wore plain clothes, always clean, always mended. His hands
  were the hands of a killer: scarred, steady, and unexpectedly gentle when correcting a boy's
  grip on a sword.

  When he spoke, you listened, because he spoke so rarely that each sentence felt earned. His eyes
  were dark brown, almost black, and they carried the particular exhaustion of a man who had seen
  exactly what human beings were capable of and had decided to keep living anyway. He smelled like
  green tea and old steel. Children in Old Harbor weren't afraid of him. Dogs followed him. Both
  of these things said more about him than any war record.

  His military augments were visible if you knew where to look — a slight metallic sheen under the
  skin of his left forearm where a reflex booster had been installed, a faint clicking in his right
  knee when the weather changed. By the end, these were more liability than asset. The reflex
  booster would fire randomly, making his hand twitch. The knee locked up in the cold. He refused
  to have them serviced. Whether that was principle or penance, Kael never asked.
origins: |
  Tanaka Hiroshi was born in the Osaka Protectorate, back when it was still nominally Japanese
  sovereign territory. His father was a factory supervisor for Mitsuhama Industrial; his mother
  taught calligraphy at a school that Axiom Industries would later acquire and convert into a
  data processing center. He enlisted in the Corporate Defense Forces at eighteen — not out of
  patriotism, but because the enlistment bonus would pay for his sister's medical augments.

  He rose through the ranks during the Consolidation Wars with a reputation for tactical
  brilliance and an unsettling calm under fire. He commanded a company during the Kanto Corridor
  Offensive, the Jakarta Sweep, and the Seoul Partition. His unit had one of the highest kill
  ratios and one of the lowest casualty rates in the theater. He was considered a model officer.

  The thing that broke him wasn't dramatic. It was a Tuesday. His unit was ordered to clear a
  residential block in Manila that had been designated as harboring insurgents. The "insurgents"
  were families who'd refused a relocation order because they couldn't afford transit passes. He
  followed the order. Forty-three civilians died. The operation was classified as a success.

  He deserted eleven days later. Walked out of a forward operating base with nothing but his
  sword — an anachronism he'd carried since his first deployment, half joke, half talisman. He
  drifted for years. Mercenary work, mostly, then less and less of it. He washed up in Old Harbor
  because it was the one place nobody looked. He found a drowned warehouse, cleaned it out, and
  began practicing katas alone in the dark.

  He found Kael seven years later — a feral twelve-year-old trying to steal his rice. Instead of
  chasing the boy off, Tanaka set out a second bowl. He never formally offered to teach Kael.
  He simply began doing katas where the boy could see, and waited. Kael picked up a stick three
  days later. The lesson lasted seven years.
psychology:
  facet_weights:
    wound: 0.9
    ideal: 0.8
    id: 0.3
    shadow: 0.7
    mask: 0.4
    ghost: 0.95
  core_fears:
    - "That his teaching perpetuated the cycle of violence he tried to escape"
    - "That Kael would become what he was — efficient, obedient, and empty"
    - "That peace was something he performed rather than something he achieved"
  core_desires:
    - "Atonement through transmission — passing on wisdom as a form of repair"
    - "To die having left something in the world that wasn't a body count"
    - "To see Kael choose, freely, a path Tanaka himself was never brave enough to take"
  coping_mechanisms:
    - "Ritual and discipline as containment for guilt"
    - "Teaching as sublimated confession"
    - "Silence — if he doesn't speak about Manila, it exists only in his own skull"
    - "Physical exhaustion through training, well past what his aging body could handle"
  blind_spots:
    - "He romanticized the samurai code as a solution to moral chaos, ignoring that historical samurai served lords just as soldiers serve corporations"
    - "He never told Kael about Manila. The lesson he most needed to teach was the one he couldn't bear to speak."
    - "He confused Kael's obedience with understanding"
  secret: |
    He kept a list. A physical, handwritten list on rice paper, folded into a square and kept
    inside the handle of his sword. Forty-three names — every civilian killed in the Manila
    operation. He added to it over the years: names of people he'd killed as a mercenary, people
    who died because of his orders, people he failed to save. By the time he died, the paper was
    full on both sides, the handwriting shrinking to fit. Kael found it when he inherited the
    sword. He has never unfolded it.
appearance:
  physical: |
    Lean and angular, with the ropy musculature of a man who trained daily into his sixties. Skin
    weathered to the color of old wood. Close-cropped grey hair, almost white at the temples.
    Deep-set eyes with permanent dark circles. The scar through his left eyebrow gave him a
    perpetually skeptical expression. His hands were disproportionately large for his frame,
    knuckles swollen from decades of impact training. He moved with an economy that made other
    people look like they were flailing.
  augmentations: |
    Minimal, all military-grade from the Consolidation Wars era, all failing:
    - Left forearm reflex booster (Mitsuhama MkII): designed to accelerate draw speed by 40%.
      By the end, it fired involuntarily, causing hand tremors.
    - Right knee stabilizer (generic CDF issue): originally compensated for a combat injury.
      Locked up in cold or damp weather, which in Old Harbor meant most days.
    - Subdermal armor mesh across the torso (partial): installed after the Jakarta Sweep.
      Had begun to calcify, causing chronic pain he never mentioned.
    He refused all maintenance. "The body should remember what it's done."
  distinctive_features:
    - "Scar bisecting left eyebrow"
    - "Slightly crooked jaw from an old break"
    - "Hands that never trembled when holding a blade, even when they trembled everywhere else"
    - "A stillness that made rooms feel quieter"
daily_life:
  routine: |
    Tanaka rose before dawn every day without exception. He meditated for one hour facing the
    water — Old Harbor's flooded streets served as his garden. Then katas, alone first, then with
    Kael once the boy was old enough. He prepared rice and tea with the same precision he applied
    to swordwork. Afternoons were spent maintaining the warehouse, repairing fishing nets for the
    Old Harbor community (his sole income), and reading — he had a small collection of paper books,
    water-damaged but legible. Evenings were for teaching Kael: philosophy, history, strategy,
    meditation. He went to sleep early and slept poorly. He never complained about either.
  habits:
    - "Cleaned his sword every evening, regardless of whether it had been used"
    - "Drank exactly three cups of green tea per day"
    - "Paused before answering any question, even simple ones"
    - "Sat facing the door in any room"
    - "Never turned his back on open water"
relationships:
  - name: "Kael"
    type: "Mentor / Surrogate father"
    description: |
      The central relationship of both their lives. Tanaka saw in Kael a chance to raise a warrior
      who might be better than he was — someone who could carry the discipline without the
      complicity. He was demanding, patient, occasionally harsh, and never once told Kael he was
      proud of him. He showed it in other ways: the quality of the sword he made for Kael, the
      extra portion of rice, the fact that he trusted the boy with silence. The great failure of
      the relationship is that Tanaka taught Kael how to live by a code, but never taught him
      what to do when the code isn't enough.
  - name: "Chen Wei-Lin"
    type: "Neighbor / Quiet ally"
    description: |
      Mrs. Chen and Tanaka had a respectful, minimal relationship. She brought him soup when his
      augments were acting up. He repaired her shop's shutters when storms hit. They never discussed
      the wars, though both had been shaped by them. She was one of the few people who saw him
      smile. After his death, she transferred the care — the soup, the quiet attention — to Kael
      without comment.
speech_patterns:
  vocabulary: "Sparse, classical, precise. He used simple words but arranged them with weight. Occasional Japanese phrases, never translated — if you didn't understand, that was the lesson."
  cadence: "Slow, measured, with long pauses. He spoke the way he moved: nothing wasted. His silences were as deliberate as his words."
  example_lines:
    - "The sword does not decide who it cuts. That burden is yours."
    - "You are angry. Good. Now put it somewhere useful."
    - "A man who kills without thought is a weapon. A man who kills with thought is a murderer. You must be both and neither."
    - "Eat first. Philosophy is for the fed."
    - "I did not teach you to win. I taught you to choose."
    - "..."
  quirks:
    - "Would answer questions with silence if he felt the student should work out the answer alone"
    - "Used cooking metaphors when discussing combat — 'you're overcooking the strike, let it rest'"
    - "Never used anyone's name more than necessary"
    - "Ended most conversations by standing up and walking away — the lesson was over when he decided it was over"
narrative_function: |
  Tanaka is the ghost in the machine — literally absent but thematically omnipresent. He
  represents the seductive promise of a moral code: the idea that if you just follow the right
  rules, you can be a good person even in a corrupt world. His death left Kael with the code
  but not the context. Tanaka's unspoken hypocrisy — that he taught violence as a path to peace,
  that he hid his worst sins behind discipline — is the question Kael must eventually confront.
  Was Tanaka wise, or was he just a killer who found a prettier frame for it? And if the frame
  was a lie, does the beauty of it still matter?

  He also poses the structural question of the narrative: can a code survive contact with reality?
  Tanaka died before his was truly tested in the new world. Kael doesn't have that luxury.
story_hooks:
  - "Kael discovers the list of names hidden in the sword handle and must decide whether to unfold it"
  - "A survivor of the Manila operation surfaces in New Meridian, seeking the officer who gave the order"
  - "Tanaka's former military unit is reformed by Axiom Industries as a private security force — his legacy weaponized"
  - "Kael encounters a situation identical to Manila and must choose differently than his teacher did"
  - "Someone claims to have been Tanaka's student before Kael — and they learned very different lessons"
