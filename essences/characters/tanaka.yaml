type: character
name: "Tanaka Hiroshi"
aliases: ["Tanaka-sensei", "The Old Man", "the ghost"]
role: "Mentor (deceased)"
age: 65
status: "deceased"
location: "Old Harbor — buried in the flooded cemetery on Pier 9, marked by a single rusted katana driven into the mud"
description: |
  Tanaka was built like a stripped cable — no excess, no softness, every tendon visible beneath weathered skin
  the color of teak left in salt air. His hands were the most telling feature: heavy knuckles, precise fingers,
  the left hand missing its ring finger from a field amputation during the Busan Corridor campaign. He kept his
  grey hair cropped to stubble, and his face held two expressions — calm and calmer. A scar ran from his right
  temple to his jaw, a memento from a monofilament trap in the Jakarta Consolidation, and it pulled his mouth
  into what looked like a permanent half-smile that was not a smile at all.

  He moved like water finding a drain — unhurried, inevitable. Even in his last years, when the old military
  augments were misfiring and his left knee locked without warning, he could cross a room and have a blade at
  your throat before you processed that he'd stood up. He wore the same faded military jacket every day, patches
  removed, insignia cut away, as if he could amputate his history with a seam ripper.

  First impression: a quiet old man who cooked rice and stared at the drowned skyline. Second impression,
  if you were unlucky enough to earn one: the most dangerous person you had ever met, and the saddest.
origins: |
  Born in Osaka-3 (the corporate rebuild) to a family of mid-tier Kenshin Group engineers. Enlisted at 18
  into Kenshin's private military division during the first phase of the Consolidation Wars. Rose to the rank
  of field commander by 27. His unit, the 14th Rapid Pacification Group, was responsible for "stabilizing"
  three Southeast Asian economic zones — a euphemism that meant burning out local resistance so corporate
  infrastructure could move in.

  He was good at it. That was the problem.

  The breaking point was the Dhaka Corridor incident — his unit was ordered to clear a residential block
  flagged as a guerrilla staging area. It wasn't. He knew it wasn't. He followed orders. Two hundred and
  twelve civilians. He could still count them twenty years later, in his sleep, by their faces.

  He deserted six months after, during a transit through Neo-Shanghai. Walked off a transport with nothing
  but his sidearm and his grandfather's katana. Spent three years drifting through the margins — the
  unincorporated zones, the drowned cities, the places where corporate jurisdiction frayed. Ended up in
  Old Harbor because it was the one place nobody came looking.

  He found Kael stealing dried fish from a market stall. The boy was twelve, feral, fast, and had the
  particular dead-eyed focus of a child who had already decided the world was an enemy. Tanaka recognized
  that look. He'd worn it himself, at the end.

  He didn't save Kael out of kindness. He saved Kael because he needed to believe that what he knew — the
  discipline, the blade, the code — could be given to someone who might use it better than he had.
psychology:
  facet_weights:
    wound: 0.9
    ideal: 0.85
    id: 0.3
    shadow: 0.7
    mask: 0.6
    ghost: 0.95
  core_fears:
    - "That his teaching was just another form of violence — shaping a child into a weapon"
    - "That discipline is a lie he told himself to survive his own memories"
    - "That Kael will face the same impossible choice he faced in Dhaka, and there is no right answer"
  core_desires:
    - "To transmit something uncorrupted — a code that might outlast the world that broke him"
    - "To die having done one thing that was unambiguously good"
    - "To be forgotten as a soldier and remembered as a teacher"
  coping_mechanisms:
    - "Ritual — tea ceremony, blade maintenance, meditation. Structure as antidote to chaos."
    - "Silence — he believed that most suffering came from unnecessary speech"
    - "Teaching — pouring himself into Kael was the only thing that quieted the dead"
  blind_spots:
    - "He never told Kael the full truth of what he did in the wars. He taught a code he himself had broken."
    - "He confused discipline with healing. Kael learned to fight but not to grieve."
    - "He could not see that his calm was also a kind of numbness"
  secret: |
    He kept a handwritten list of every person he could remember killing. Two hundred and sixty-one names,
    or descriptions when he didn't know names. He added to it from memory until the day he died. The list
    is hidden inside the hilt of the katana he left to Kael. Kael has never found it.
appearance:
  physical: |
    Lean, weathered, 5'10". Skin darkened and lined from decades of exposure. Prominent cheekbones,
    deep-set eyes that were almost black. The scar from temple to jaw. Missing ring finger on the left hand.
    Posture always upright, even sleeping — a military habit that never left. In his last year, he walked
    with a slight drag in his left leg where the knee augment had seized.
  augmentations: |
    Minimal, old Kenshin Group military-standard. A reinforced skeletal frame (titanium-laced radius and
    ulna, both arms) that was state-of-the-art thirty years ago and now triggered metal detectors and
    ached in the cold. A neural reaction enhancer at the base of his skull, mostly burned out, that
    occasionally fired ghost-signals — phantom movements, a twitch in his sword hand at 3 AM. A
    replacement left knee that locked unpredictably. He refused all maintenance on principle.
  distinctive_features:
    - "Temple-to-jaw monofilament scar"
    - "Missing left ring finger"
    - "Faded military jacket with all insignia removed"
    - "The half-smile that was not a smile"
    - "Hands that were never still — always adjusting, gripping, testing surfaces"
daily_life:
  routine: |
    Rose before dawn. Meditated facing the drowned harbor for exactly one hour. Prepared rice and dried fish.
    Trained Kael for four hours — blade work, hand-to-hand, meditation, and the philosophy he called "the
    geometry of intention." Afternoons: he repaired fishing nets for Old Harbor residents in exchange for
    supplies. He read — actual paper books, salvaged, warped with damp. Evenings: he sat on the roof of
    their shelter and watched the bioluminescent algae bloom in the flooded streets below. He never drank.
    He never raised his voice. He went to sleep sitting upright, blade across his knees.
  habits:
    - "Sharpened his blade every evening, exactly forty strokes per side"
    - "Brewed tea with mechanical precision — temperature, timing, never varying"
    - "Counted exits in every room, even rooms he'd been in a thousand times"
    - "Spoke to the dead in whispers when he thought Kael was asleep"
relationships:
  - name: "Kael"
    type: "student / surrogate son"
    description: |
      The most important relationship of his final years. He saw in Kael the chance to transmit his code
      to someone uncorrupted by the corporate machine. But he also saw a feral, angry child, and he knew
      that discipline without understanding could produce a more efficient monster. He tried to teach both
      the blade and the reason to sheathe it. Whether he succeeded is the central question of Kael's life.
  - name: "Chen Wei-Lin"
    type: "neighbor / quiet alliance"
    description: |
      Mrs. Chen arrived on the Shelf three years before Tanaka died. They recognized each other instantly —
      not personally, but categorically. Two people who had seen the machine from the inside and walked away.
      They never discussed their pasts. She brought him soup when his augments flared. He repaired her
      shop's generator. It was the closest thing to friendship either of them had.
  - name: "The 14th Rapid Pacification Group"
    type: "former comrades / ghosts"
    description: |
      He never spoke of them by name. But sometimes Kael would catch him staring at nothing, lips moving,
      and understood that the old man was somewhere else entirely — a place with different weather and
      different screams.
speech_patterns:
  vocabulary: "Sparse, precise, drawn from military terminology and classical Japanese philosophy. He never used two words when one would do. Occasionally quoted texts Kael couldn't identify — Musashi, Hagakure, but also Camus and Marcus Aurelius."
  cadence: "Slow, deliberate, with long pauses that were not hesitation but emphasis. His silences were louder than most people's speeches. When he gave an order during training, it came once, quietly, and was not repeated."
  example_lines:
    - "The blade does not decide. You decide. The blade agrees."
    - "You are angry. Good. Now put it somewhere useful or put it down."
    - "I am not teaching you to kill. Any animal can kill. I am teaching you to choose."
    - "Eat first. Philosophy is for the fed."
    - "You ask why I came here. I stopped asking why. That is how I came here."
    - "The corporate world is a machine. You cannot fight a machine. You can only refuse to be a gear."
  quirks:
    - "Never answered a question directly if a proverb or parable could serve instead"
    - "Corrected Kael's posture mid-sentence, even during emotional conversations"
    - "Referred to death as 'the appointment' — never euphemized but never dramatized"
    - "Would go completely silent for hours, not as punishment, but as weather — it simply happened"
narrative_function: |
  Tanaka is the ghost in the machine of Kael's psyche. Every moral decision Kael makes is a conversation
  with a dead man. Tanaka represents the possibility that a code of honor can exist in a dishonorable
  world — but also the danger that such a code is just another story we tell ourselves to justify violence.

  He poses the central question to Kael: Can you live by a code that the man who taught it to you could
  not? And if you can — does that redeem him, or just prove you haven't been tested enough yet?

  Tanaka is also the story's critique of the mentor archetype. He was not wise — he was traumatized.
  He was not at peace — he was exhausted. His calm was not enlightenment but the stillness of a man
  who had simply stopped running. Whether that distinction matters is up to Kael to decide.
story_hooks:
  - "The hidden list inside the katana hilt — if Kael discovers it, every lesson reshapes"
  - "Survivors of the 14th RPG who might recognize the katana or know Tanaka's real history"
  - "The Dhaka Corridor incident resurfacing — war crimes tribunals, corporate liability, someone digging up old records"
  - "Another student — did Tanaka try to teach someone before Kael? What happened to them?"
  - "Kael encountering a situation identical to Dhaka and having to choose differently, or not"
