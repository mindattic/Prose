name: Build and deploy StreetSamurai to Azure App Service

# Two-stage pipeline:
#   build   — restore + publish the Blazor host as a deployable artifact
#   deploy  — push the artifact to the streetsamurai App Service slot
#
# A `migrate` job that ran ApplyMigrations against Azure SQL via OIDC was
# removed 2026-05-23: the initial schema landed via SqlPackage bacpac
# import, and subsequent schema changes (when they come) are applied
# manually for now. To re-add CI-driven migrations later, restore the
# `migrate` job + the three repo secrets (AZURE_CLIENT_ID,
# AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID) and the GRANT on the SQL DB
# for the GitHub OIDC service principal — see infra/README.md.

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # NuGet.config at the repo root points at ./lib/local-packages/
      # for the MindAttic.Legion / MindAttic.Vault private packages.
      # Restore picks them up alongside nuget.org. The `--locked-mode`
      # flag is intentionally NOT set — bundled .nupkg files mean
      # packages.lock.json isn't a meaningful source of truth here.
      - name: Restore dependencies
        run: dotnet restore v3/StreetSamurai.Blazor/StreetSamurai.Blazor.csproj

      - name: Publish
        run: dotnet publish v3/StreetSamurai.Blazor/StreetSamurai.Blazor.csproj -c Release -o publish --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: streetsamurai-app
          path: publish/

  deploy:
    runs-on: windows-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: streetsamurai-app
          path: publish/

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: streetsamurai
          slot-name: Production
          package: publish/
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
