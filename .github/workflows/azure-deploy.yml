name: Build and deploy Prose to Azure App Service

# Four-stage pipeline:
#   build   — restore + publish the Codex web host as a deployable artifact
#   test    — run the full Prose.UnitTests suite; blocks migrate/deploy on any failure.
#             The suite is CI-safe by design: DB-backed tests use an in-memory SQLite
#             factory (TestDbFactory), not a real SQL Server — the handful that
#             legitimately need a live LocalDB/Azure SQL connection (InterfaceRegistrationTests,
#             WorldValidationTests) skip gracefully (Assert.Inconclusive/Assert.Ignore) when
#             that connection isn't reachable, so this job never fails a build just because
#             the CI runner has no LocalDB instance.
#   migrate — apply schema + enable SYSTEM_VERSIONING against Azure SQL,
#             authenticated via the GitHub OIDC service principal (db_ddladmin)
#   deploy  — push the artifact to the mindattic-prose App Service slot
#             (App Service name 'prose' was already taken globally on
#             *.azurewebsites.net by an unrelated Azure customer — the app
#             is named 'mindattic-prose' instead; only the hostname differs,
#             everything else keeps the 'prose' naming.)
#
# The migrate job runs `v3/ApplyMigrations`: the idempotent Data/Sql/*.sql
# column migrations, the nested-strand fold, then EnableSystemVersioningAsync()
# — which turns on system versioning for Beats / Strands / StrandBeats and the
# rest of the canon temporal set. It authenticates with azure/login@v2 (OIDC)
# and connects with Authentication=Active Directory Default. The App Service
# managed identity is read/write only and cannot run DDL, so schema changes
# ride the OIDC service principal instead. Requires repo secrets
# AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID /
# AZURE_SQL_CONNECTION and the db_ddladmin GRANT — see infra/README.md.
# (Re-added 2026-06-04; closes the manual-apply gap left on 2026-05-23.)
#
# (test job added 2026-08-09: previously nothing in this pipeline ever ran
# `dotnet test` — every push to master built, migrated, and deployed straight to
# production with zero automated regression signal from the 1800+-test suite.)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # NuGet.config at the repo root points at ./lib/local-packages/
      # for the MindAttic.Legion / MindAttic.Vault private packages.
      # Restore picks them up alongside nuget.org. The `--locked-mode`
      # flag is intentionally NOT set — bundled .nupkg files mean
      # packages.lock.json isn't a meaningful source of truth here.
      # Restore with Release configuration so MindAttic.Authentication resolves as
      # a NuGet package (PackageReference), not as a ProjectReference. The csproj
      # conditionally includes a ProjectReference in Debug only; restoring without
      # --property:Configuration=Release bakes the project path into project.assets.json
      # and causes CS0234/CS0246 on every Release build.
      - name: Restore dependencies
        run: dotnet restore v3/Prose.Codex/Prose.Codex.csproj --property:Configuration=Release

      - name: Publish
        run: dotnet publish v3/Prose.Codex/Prose.Codex.csproj -c Release -o publish --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prose-app
          path: publish/

  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore v3/Prose.UnitTests/Prose.UnitTests.csproj

      - name: Run unit tests
        run: dotnet test v3/Prose.UnitTests/Prose.UnitTests.csproj --no-restore --configuration Release --logger "console;verbosity=normal"

  migrate:
    runs-on: windows-latest
    needs: [build, test]

    # OIDC: id-token lets azure/login@v2 mint a federated token for the
    # prose-github service principal (db_ddladmin on the SQL DB).
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # v3/ApplyMigrations (the original standalone migration console app) was
      # deleted at some point; its job now lives in Prose.Cli's --migrate-sql
      # --schema flag (MigrateSqlCli.cs) — same idempotent EF-migration +
      # SYSTEM_VERSIONING work, just dispatched through the main CLI instead
      # of a separate project. Restore the CLI so its transitive Core deps
      # (Legion / Vault) resolve.
      - name: Restore Prose.Cli
        run: dotnet restore v3/Prose.Cli/Prose.Cli.csproj --property:Configuration=Release

      # Resolves the connection string from ConnectionStrings__Prose (env wins
      # over appsettings/LocalDB). AZURE_SQL_CONNECTION carries
      # Authentication=Active Directory Default; the OIDC token from
      # azure/login flows through DefaultAzureCredential. Idempotent — safe to
      # run on every master push.
      - name: Apply schema + enable temporal versioning
        env:
          ConnectionStrings__Prose: ${{ secrets.AZURE_SQL_CONNECTION }}
        run: dotnet run --project v3/Prose.Cli/Prose.Cli.csproj -c Release --no-restore -- --migrate-sql --schema

  deploy:
    runs-on: windows-latest
    needs: [build, migrate]

    # OIDC, same federated identity as the migrate job — no publish-profile
    # secret to manage or leak. azure/webapps-deploy picks up the active
    # az login session automatically when publish-profile is omitted.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: prose-app
          path: publish/

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: mindattic-prose
          slot-name: Production
          package: publish/
